<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathematics Atlas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem('atlas-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Mathematics Atlas</a>
  <div class="search" role="combobox" aria-expanded="false">
    <input id="q" type="search" placeholder="Search formulas, patterns, pictures…" autocomplete="off" spellcheck="false" aria-label="Search the atlas">
    <ul id="results" role="listbox" hidden></ul>
  </div>
  <nav class="nav">
    <a href="#/map">Map</a>
    <a href="#/fields">Fields</a>
    <a href="#/patterns">Patterns</a>
    <a href="#/metaphors">Pictures</a>
  </nav>
  <button id="theme" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
  </button>
</header>
<main id="page"></main>
<div id="tip" class="tip" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
