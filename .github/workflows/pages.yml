name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check-math
      - name: Cache-bust assets
        # Pages serves files with max-age=600; versioned URLs make browsers refetch changed files.
        run: |
          cd site
          for f in style.css app.js data.js; do
            v=$(sha256sum "$f" | cut -c1-10)
            sed -i "s|\"$f\"|\"$f?v=$v\"|" index.html
          done
          grep -o '[a-z]*\.\(css\|js\)?v=[0-9a-f]*' index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
